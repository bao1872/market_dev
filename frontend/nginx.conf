# V1.1 交易平台 - 前端 nginx 配置
# 职责：托管 SPA 静态资源 + 反向代理 /api 到后端服务
#
# [nginx DNS] - Docker 容器重建后 backend IP 会变化，必须配置 resolver 并在
# proxy_pass 中使用变量，强制 nginx 在每次请求时重新解析 backend 主机名。
# 否则 backend 容器重建后 frontend nginx 仍连接旧 IP，导致所有 /api 请求 502。
#
# [Gate5] access_log 配置：
# - 使用标准 COMBINED 日志格式（GoAccess --log-format=COMBINED 解析）
# - IP 匿名化由 GoAccess --anonymize-ip 处理（保留前 3 段，末段为 0）
# - 敏感 query 参数（token/jwt/password/key）由 backend _sanitize_path() 在展示时脱敏
# - access_log 写入 /var/log/nginx/access.log，由 GoAccess 容器只读挂载解析
# - 日志轮转由 Docker json-file 驱动控制（50m × 5 = 250MB）

server {
    listen 80;
    server_name _;

    # [Gate5] 访问日志：标准 COMBINED 格式，写入共享卷供 GoAccess 解析
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log;

    # Docker 嵌入式 DNS，valid=10s 控制缓存 TTL
    resolver 127.0.0.11 valid=10s;

    # SPA 静态资源根目录
    root /usr/share/nginx/html;
    index index.html;

    # ===== gzip 压缩 =====
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # ===== /api 反向代理到后端（去掉 /api 前缀） =====
    # 使用变量而非静态 upstream，确保 backend 容器 IP 变化后自动重新解析。
    # proxy_pass 使用变量时不会自动剥离 location 前缀，需配合 rewrite。
    #
    # [CHANGE-20260719-001 §六-E] backend health 路由为 /health（无 /api/v1 前缀），
    # 但部署合同要求 /api/v1/health 可经 frontend proxy 访问。
    # 此处用精确匹配 location = /api/v1/health 直接 proxy 到 backend /health，
    # 不影响 /api/ 通用 rewrite（前端 apiClient baseURL='/api' + path='/api/v1/xxx'
    # → 请求 /api/api/v1/xxx → rewrite → /api/v1/xxx 的既有契约保持不变）。
    location = /api/v1/health {
        set $backend_url backend:8000;
        proxy_pass http://$backend_url/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== [CHANGE-20260729-009] /umami/ 反向代理到 Umami 访客分析服务 =====
    # Umami 替代 GoAccess：保留 nginx access.log + 轮转，访客分析改用 Umami。
    # 前端在 production 模式下注入 <script src="/umami/script.js" data-website-id="xxx">
    # script.js 由 Umami 容器提供（默认监听 3000 端口）。
    # 数据上报路径 /umami/api/send 也由本代理转发到 umami:3000。
    # 开发/capture 模式不注入 tracking script（docker-entrypoint.sh 控制注入）。
    location /umami/ {
        set $umami_url umami:3000;
        # /umami/ 前缀剥离后转发，proxy_pass 用变量时不自动剥离前缀，需 rewrite
        rewrite ^/umami/(.*) /$1 break;
        proxy_pass http://$umami_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 支持（Umami 实时面板可能使用）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        set $backend_url backend:8000;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://$backend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（盘中实时推送）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ===== index.html 禁止缓存，确保新 bundle 生效 =====
    # [CHANGE-20260729-009] Umami tracking script 通过 nginx sub_filter 注入
    # - 不修改 dist/index.html（Live Mount 模式下 dist 只读挂载）
    # - 用 sub_filter 在响应 </head> 前动态注入 script tag
    # - website_id 通过 docker-entrypoint.sh 用 envsubst 渲染到本配置
    # - UMAMI_WEBSITE_ID 为空时 sub_filter 不替换（${UMAMI_WEBSITE_ID} 为空字符串，
    #   script tag 仍注入但 data-website-id 为空，Umami 会忽略无效 id）
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        sub_filter '</head>' '<script async src="/umami/script.js" data-website-id="${UMAMI_WEBSITE_ID}"></script></head>';
        sub_filter_once on;
        sub_filter_types text/html;
        try_files $uri =404;
    }

    # ===== hash 化的 JS/CSS 长期缓存 =====
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ===== 公开静态门户（Vite public/portal）=====
    # [CHANGE-20260723-006] 用静态门户替换公开根路径 /，业务路由保持原样。
    # / 精确匹配：直接返回 /portal/index.html，地址保持 /，不进入 React SPA。
    # 优先级：location = / 是精确匹配，高于下方 location / 前缀（SPA fallback），
    # 因此只有精确 / 走门户，其余未匹配路径仍由 SPA fallback 处理。
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files /portal/index.html =404;
    }

    # 门户首页本身也禁缓存
    location = /portal/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 门户说明页（/portal/pages/*.html）禁缓存
    location ~ ^/portal/pages/.*\.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 门户其他静态资源（CSS/JS/JSON/PNG/SVG）：可正常访问，不抢占业务/API/Capture 路由
    location /portal/ {
        try_files $uri =404;
    }

    # ===== SPA 前端路由回退 =====
    location / {
        try_files $uri $uri/ /index.html;
    }
}
