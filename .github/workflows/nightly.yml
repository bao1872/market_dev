# Nightly — 定时全量回归
#
# 职责（CHANGE-20260802-002 CI 分层重构）：
#   - 全量 pytest（含 postgres marker 全集，不做任何范围裁剪）；
#   - Migration base -> head -> base -> head 完整循环；
#   - 全量 Playwright E2E；
#   - 外部数据源测试独立分组（不阻断，单独报告）；
#   - 全仓 Ruff / Mypy 报告（非增量，允许存量告警，仅作趋势观测）；
#   - 前端全量检查。
#
# 与 Fast CI 的关系：Fast CI 按变更范围裁剪以换取速度，
# 由本工作流每日兜底，保证「被裁剪掉的部分」不会长期无人执行。
name: Nightly

on:
  schedule:
    # 每日 03:00 Asia/Shanghai = 19:00 UTC（前一日）
    - cron: "0 19 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  full-pytest:
    name: Full pytest (all markers)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bz
          POSTGRES_PASSWORD: bz
          POSTGRES_DB: bz_stock_test
          TZ: Asia/Shanghai
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://bz:bz@localhost:5432/bz_stock_test
      TEST_DATABASE_URL: postgresql+asyncpg://bz:bz@localhost:5432/bz_stock_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: for i in {1..30}; do pg_isready -h localhost -p 5432 -U bz && break; sleep 1; done
      - run: alembic upgrade head
      # 全量：postgres + 纯单元全部执行。external_data 单独分组，
      # 避免外部数据源抖动把 Nightly 的代码回归信号污染成红色。
      - name: Full pytest (excluding external_data)
        run: pytest -m "not external_data" --tb=short -q -p no:randomly

  # ---------------------------------------------------------------------------
  # 外部数据源测试：独立分组，独立报告，不阻断 Nightly 结论。
  # 失败通常意味着 mootdx / 交易所接口不可达或数据延迟，而非本仓库代码回归。
  # ---------------------------------------------------------------------------
  external-data-tests:
    name: External Data Tests (non-blocking)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      PURE_UNIT_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Run external data tests
        id: ext
        continue-on-error: true
        run: |
          set -uo pipefail
          pytest -m external_data --tb=short -q -p no:randomly --junitxml=/tmp/ext.xml
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - name: Report external data results
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET, os
          print("## External Data Tests（不阻断）\n")
          try:
              r = ET.parse('/tmp/ext.xml').getroot()
              s = r if r.tag == 'testsuite' else r.find('testsuite')
              t = int(s.get('tests', 0)); f = int(s.get('failures', 0))
              e = int(s.get('errors', 0)); k = int(s.get('skipped', 0))
              print(f"| 总数 | 失败 | 错误 | 跳过 |")
              print(f"|---|---|---|---|")
              print(f"| {t} | {f} | {e} | {k} |\n")
              if f or e:
                  print("失败用例：\n")
                  for tc in s.iter('testcase'):
                      if tc.find('failure') is not None or tc.find('error') is not None:
                          print(f"- `{tc.get('classname')}::{tc.get('name')}`")
                  print("\n> 外部数据源不可达属预期波动，不代表代码回归；"
                        "若连续多日失败需人工核查数据源可用性。")
              else:
                  print("全部通过。")
          except Exception as exc:
              print(f"无法解析结果：{exc}")
          PY

  migration-full-cycle:
    name: Migration base -> head -> base -> head
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bz
          POSTGRES_PASSWORD: bz
          POSTGRES_DB: bz_stock_test
          TZ: Asia/Shanghai
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://bz:bz@localhost:5432/bz_stock_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: for i in {1..30}; do pg_isready -h localhost -p 5432 -U bz && break; sleep 1; done
      - name: Full cycle
        run: |
          set -euo pipefail
          N=$(alembic heads | grep -c '(head)' || true)
          [ "$N" = "1" ] || { echo "::error::alembic head 数=$N，必须为 1"; exit 1; }
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current

  full-lint-report:
    name: Full Ruff / Mypy report
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Ruff (full repo, report only)
        continue-on-error: true
        run: ruff check . --statistics
      - name: Mypy (full repo, report only)
        continue-on-error: true
        run: mypy app | tail -50

  frontend-full:
    name: Frontend full checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:contract
      - run: npm run build

  # ---------------------------------------------------------------------------
  # 全量 Playwright E2E。
  # 该套件全部通过 page.route() mock /api/**，不依赖后端与生产数据，
  # 因此可独立运行；失败即代表前端关键路径真实回归，属阻断项。
  # ---------------------------------------------------------------------------
  playwright-e2e:
    name: Full Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Playwright browsers
        run: npm run e2e:install
      - name: Run Playwright E2E
        run: npm run test:e2e
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace-${{ github.run_id }}
          path: frontend/test-results/
          retention-days: 7

  nightly-summary:
    name: Nightly Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - full-pytest
      - external-data-tests
      - migration-full-cycle
      - full-lint-report
      - frontend-full
      - playwright-e2e
    steps:
      - run: |
          {
            echo "## Nightly 回归结果"
            echo ""
            echo "| job | 结果 | 阻断 |"
            echo "|---|---|---|"
            echo "| full-pytest | ${{ needs.full-pytest.result }} | 是 |"
            echo "| migration-full-cycle | ${{ needs.migration-full-cycle.result }} | 是 |"
            echo "| frontend-full | ${{ needs.frontend-full.result }} | 是 |"
            echo "| playwright-e2e | ${{ needs.playwright-e2e.result }} | 是 |"
            echo "| external-data-tests | ${{ needs.external-data-tests.result }} | 否（外部依赖） |"
            echo "| full-lint-report | ${{ needs.full-lint-report.result }} | 否（趋势观测） |"
          } >> "$GITHUB_STEP_SUMMARY"
          # 关键回归失败必须让 Nightly 变红。
          # lint 报告与外部数据源为观测项，不阻断——前者允许存量告警，
          # 后者失败通常源于外部服务不可达而非代码回归。
          FAILED=0
          for r in "${{ needs.full-pytest.result }}" \
                   "${{ needs.migration-full-cycle.result }}" \
                   "${{ needs.frontend-full.result }}" \
                   "${{ needs.playwright-e2e.result }}"; do
            [ "$r" = "success" ] || FAILED=$((FAILED+1))
          done
          [ "$FAILED" -eq 0 ] || { echo "::error::Nightly 有 $FAILED 项关键回归失败"; exit 1; }
          echo "Nightly PASSED"
