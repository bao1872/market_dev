# Release Gate — 手动触发，输入 exact dev SHA
#
# 职责（CHANGE-20260802-002 部署架构重构）：
#   - 校验输入 SHA 确实属于 origin/dev；
#   - 全量关键 PostgreSQL 集成测试（不得跳过）；
#   - Migration 完整验证（base -> head -> down -> head，单一 head）；
#   - 构建 backend / frontend / capture 三个不可变镜像并推送 Registry；
#   - 生成 release manifest（完整 git SHA、每镜像 repo/tag/digest、alembic head、构建时间）；
#   - 输出 Release Gate summary。
#
# manifest 是部署的唯一输入：服务器不再自行推断变更文件、不再自行构建。
#
# 说明（GHCR 阻塞）：2026-08-02 实测生产服务器无 ghcr.io 凭据、
#   本机 gh CLI 未认证，`docker pull ghcr.io/...` 返回 401。
#   因此 push-images 由 `push_images` 输入控制，默认 false：
#   在凭据打通前，Release Gate 仍完整构建并产出 manifest/digest（可验证），
#   但不推送；部署侧通过 panji-test-deploy 的 --allow-local-build 过渡开关运行。
#   凭据配置后把 push_images 默认改为 true 并去掉部署侧过渡开关即可。
name: Release Gate

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "要发布的 exact dev SHA（40 位完整 SHA）"
        required: true
        type: string
      push_images:
        description: "是否推送镜像到 Registry（需已配置 GHCR 凭据）"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-gate
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  verify-sha:
    name: Verify SHA on origin/dev
    runs-on: ubuntu-latest
    outputs:
      full_sha: ${{ steps.v.outputs.full_sha }}
      short_sha: ${{ steps.v.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}
      - name: Verify SHA is an ancestor of origin/dev
        id: v
        run: |
          set -euo pipefail
          SHA="${{ inputs.sha }}"
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::必须提供 40 位完整 SHA，当前: $SHA"; exit 1
          fi
          git fetch origin dev --no-tags
          if ! git merge-base --is-ancestor "$SHA" origin/dev; then
            echo "::error::SHA $SHA 不是 origin/dev 的祖先，拒绝发布"; exit 1
          fi
          echo "full_sha=$SHA"            >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:7}"     >> "$GITHUB_OUTPUT"
          echo "SHA 校验通过: $SHA"

  # ---------------------------------------------------------------------------
  # 全量关键 PG 集成测试 —— 任何 skip 均视为失败
  # ---------------------------------------------------------------------------
  postgres-integration:
    name: Full PostgreSQL Integration
    runs-on: ubuntu-latest
    needs: [verify-sha]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bz
          POSTGRES_PASSWORD: bz
          POSTGRES_DB: bz_stock_test
          TZ: Asia/Shanghai
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://bz:bz@localhost:5432/bz_stock_test
      TEST_DATABASE_URL: postgresql+asyncpg://bz:bz@localhost:5432/bz_stock_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: for i in {1..30}; do pg_isready -h localhost -p 5432 -U bz && break; sleep 1; done
      - run: alembic upgrade head
      # 排除 external_data：外部行情源不可达不应阻断发布。
      # 除此之外不允许任何跳过——下一步会断言 skipped=0。
      - name: Run postgres-marked tests (no skip allowed)
        run: |
          set -euo pipefail
          pytest -m "postgres and not external_data" --tb=short -q -p no:randomly \
            --junitxml=/tmp/pg.xml
      - name: Assert no skipped PG tests
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import xml.etree.ElementTree as ET, sys
          t = ET.parse('/tmp/pg.xml').getroot()
          s = t if t.tag == 'testsuite' else t.find('testsuite')
          tests = int(s.get('tests', 0)); skipped = int(s.get('skipped', 0))
          print(f"PG tests={tests} skipped={skipped}")
          if tests == 0:
              print("::error::PG 集成测试数为 0，Release Gate 不接受空跑"); sys.exit(1)
          if skipped > 0:
              print(f"::error::Release Gate 不允许 PG 测试被跳过，skipped={skipped}"); sys.exit(1)
          PY

  # ---------------------------------------------------------------------------
  # 关键 Playwright E2E —— 发布前必须验证前端关键路径。
  # 该套件 mock 全部 /api/**，不依赖后端与生产数据，可在 Gate 中独立运行。
  # ---------------------------------------------------------------------------
  playwright-e2e:
    name: Key Playwright E2E
    runs-on: ubuntu-latest
    needs: [verify-sha]
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run e2e:install
      - name: Run key E2E scenarios
        run: npm run test:e2e
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-trace-${{ needs.verify-sha.outputs.short_sha }}
          path: frontend/test-results/
          retention-days: 30

  # ---------------------------------------------------------------------------
  migration-full:
    name: Migration Full Verify
    runs-on: ubuntu-latest
    needs: [verify-sha]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bz
          POSTGRES_PASSWORD: bz
          POSTGRES_DB: bz_stock_test
          TZ: Asia/Shanghai
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://bz:bz@localhost:5432/bz_stock_test
    outputs:
      alembic_head: ${{ steps.head.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: for i in {1..30}; do pg_isready -h localhost -p 5432 -U bz && break; sleep 1; done
      - name: Single head check
        run: |
          set -euo pipefail
          alembic heads
          N=$(alembic heads | grep -c '(head)' || true)
          [ "$N" = "1" ] || { echo "::error::alembic head 数=$N，必须为 1"; exit 1; }
      - name: base -> head -> base -> head
        run: |
          set -euo pipefail
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Record alembic head
        id: head
        run: echo "head=$(alembic current | tail -1)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  build-images:
    name: Build Immutable Images
    runs-on: ubuntu-latest
    needs: [verify-sha, postgres-integration, migration-full, playwright-e2e]
    permissions:
      contents: read
      packages: write
    outputs:
      manifest: ${{ steps.manifest.outputs.manifest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.push_images }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images
        id: build
        env:
          SHORT_SHA: ${{ needs.verify-sha.outputs.short_sha }}
        run: |
          set -euo pipefail
          BUILD_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "OWNER=$OWNER" >> "$GITHUB_ENV"

          # 用 docker compose build 而非手写 docker build：
          # compose 已定义每个镜像的 context/dockerfile/build args
          # （frontend 还需要 VITE_GIT_SHA / VITE_BUILD_TIME，手写极易漏传，
          #  漏传会导致前端页面显示错误版本号）。
          # 由 compose 统一构建可保证与生产部署完全同源，避免两套构建定义漂移。
          cat > /tmp/build.env <<EOF
          GIT_SHA=${SHORT_SHA}
          BUILD_TIME=${BUILD_TIME}
          VITE_GIT_SHA=${SHORT_SHA}
          VITE_BUILD_TIME=${BUILD_TIME}
          DEPLOYMENT_MODE=image
          EOF

          docker compose --env-file /tmp/build.env -f docker-compose.prod.yml \
            build backend frontend worker-capture

          # 盘迹共 3 个业务镜像；全部 worker-* 复用 backend 镜像。
          for n in backend frontend capture; do
            docker image inspect "market-dev-${n}:${SHORT_SHA}" >/dev/null \
              || { echo "::error::镜像未生成: market-dev-${n}:${SHORT_SHA}"; exit 1; }
            echo "已构建 market-dev-${n}:${SHORT_SHA}"
          done

      - name: Push images
        if: ${{ inputs.push_images }}
        env:
          SHORT_SHA: ${{ needs.verify-sha.outputs.short_sha }}
        run: |
          set -euo pipefail
          for n in backend capture frontend; do
            SRC="market-dev-${n}:${SHORT_SHA}"
            DST="ghcr.io/${OWNER}/market-dev-${n}:${SHORT_SHA}"
            docker tag "$SRC" "$DST"
            docker push "$DST"
          done

      # Registry 凭据未打通时，显式把推送标记为 blocked_registry_auth。
      # 关键：不伪造 digest、不改用 image tar 规避、不回退服务器构建，
      # 让阻塞状态在 Gate 输出中保持可见，而不是被静默跳过。
      - name: Mark push as blocked (no registry credentials)
        if: ${{ !inputs.push_images }}
        run: |
          {
            echo "## 镜像推送：blocked_registry_auth"
            echo ""
            echo "本次未推送镜像到 Registry。"
            echo ""
            echo "- 镜像已在本 runner 完整构建并通过 image inspect 校验；"
            echo "- manifest 已生成，但 \`digest\` 字段为空、\`pushed=false\`；"
            echo "- 未使用 image tar 旁路，未回退服务器构建。"
            echo ""
            echo "解除阻塞需先完成 Registry 凭据授权，再以 \`push_images=true\` 重跑本工作流。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::镜像推送被跳过：blocked_registry_auth（Registry 凭据未配置）"

      - name: Generate release manifest
        id: manifest
        env:
          FULL_SHA: ${{ needs.verify-sha.outputs.full_sha }}
          SHORT_SHA: ${{ needs.verify-sha.outputs.short_sha }}
          ALEMBIC_HEAD: ${{ needs.migration-full.outputs.alembic_head }}
        run: |
          set -euo pipefail
          PUSHED="${{ inputs.push_images }}"
          {
            echo "{"
            echo "  \"git_sha\": \"${FULL_SHA}\","
            echo "  \"short_sha\": \"${SHORT_SHA}\","
            echo "  \"build_time\": \"${BUILD_TIME}\","
            echo "  \"alembic_head\": \"${ALEMBIC_HEAD}\","
            echo "  \"pushed\": ${PUSHED},"
            echo "  \"images\": ["
            first=true
            for n in backend capture frontend; do
              LOCAL="market-dev-${n}:${SHORT_SHA}"
              IMG_ID="$(docker image inspect -f '{{.Id}}' "$LOCAL")"
              if [ "$PUSHED" = "true" ]; then
                REPO="ghcr.io/${OWNER}/market-dev-${n}"
                DIGEST="$(docker image inspect -f '{{index .RepoDigests 0}}' "${REPO}:${SHORT_SHA}" 2>/dev/null || echo '')"
              else
                REPO="market-dev-${n}"; DIGEST=""
              fi
              [ "$first" = true ] || echo "    ,"
              first=false
              echo "    {"
              echo "      \"name\": \"${n}\","
              echo "      \"repo\": \"${REPO}\","
              echo "      \"tag\": \"${SHORT_SHA}\","
              echo "      \"image_id\": \"${IMG_ID}\","
              echo "      \"digest\": \"${DIGEST}\""
              echo -n "    }"
              echo ""
            done
            echo "  ]"
            echo "}"
          } > release-manifest.json
          cat release-manifest.json
          python -c "import json;json.load(open('release-manifest.json'))" \
            || { echo "::error::manifest 不是合法 JSON"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ needs.verify-sha.outputs.short_sha }}
          path: release-manifest.json
          retention-days: 90

  # ---------------------------------------------------------------------------
  deploy-drill:
    name: Compose Deploy Drill
    runs-on: ubuntu-latest
    needs: [verify-sha, build-images]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - name: Validate compose config
        run: |
          set -euo pipefail
          # 用最小 env 校验 compose 可解析、服务清单符合预期
          cat > /tmp/drill.env <<EOF
          GIT_SHA=${{ needs.verify-sha.outputs.short_sha }}
          BUILD_TIME=drill
          DEPLOYMENT_MODE=image
          EOF
          docker compose --env-file /tmp/drill.env -f docker-compose.prod.yml config --services | sort | tee /tmp/services.txt
          for s in backend frontend worker-capture postgres redis; do
            grep -qx "$s" /tmp/services.txt || { echo "::error::compose 缺少服务 $s"; exit 1; }
          done
      - name: Validate deploy script syntax
        run: |
          set -euo pipefail
          bash -n scripts/ops/panji-deploy-remote.sh
          bash -n scripts/ops/panji-test-deploy
          # 部署脚本不得包含按变更文件推断服务的逻辑
          if grep -vE '^\s*#' scripts/ops/panji-deploy-remote.sh \
             | grep -nE 'RESTART_BACKEND|RESTART_FRONTEND|BUILD_IMAGES|git diff'; then
            echo "::error::部署脚本出现按变更文件推断服务的逻辑"; exit 1
          fi
          echo "部署脚本校验通过"

  # ---------------------------------------------------------------------------
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - verify-sha
      - postgres-integration
      - playwright-e2e
      - migration-full
      - build-images
      - deploy-drill
    steps:
      - name: Evaluate
        run: |
          set -euo pipefail
          declare -A R=(
            ["verify-sha"]="${{ needs.verify-sha.result }}"
            ["postgres-integration"]="${{ needs.postgres-integration.result }}"
            ["playwright-e2e"]="${{ needs.playwright-e2e.result }}"
            ["migration-full"]="${{ needs.migration-full.result }}"
            ["build-images"]="${{ needs.build-images.result }}"
            ["deploy-drill"]="${{ needs.deploy-drill.result }}"
          )
          FAILED=0
          # Release Gate 要求全部成功；任何 skipped 一律视为失败。
          for k in $(printf '%s\n' "${!R[@]}" | sort); do
            v="${R[$k]}"
            if [ "$v" = "success" ]; then
              echo "OK: $k"
            else
              echo "FAIL: $k = $v"; FAILED=$((FAILED+1))
            fi
          done
          {
            echo "## Release Gate"
            echo ""
            echo "- SHA: \`${{ inputs.sha }}\`"
            echo "- push_images: \`${{ inputs.push_images }}\`"
            if [ "${{ inputs.push_images }}" != "true" ]; then
              echo "- 镜像推送状态: **blocked_registry_auth**（凭据未配置，manifest digest 为空）"
            fi
            echo ""
            for k in $(printf '%s\n' "${!R[@]}" | sort); do
              echo "- ${k}: ${R[$k]}"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::Release Gate 失败（$FAILED 项）"; exit 1
          fi
          echo "Release Gate PASSED"
