# Live Mount 叠加配置 — 只读挂载运行时代码到容器
#
# [CHANGE-20260724-004] Live Mount 部署：
# 与 docker-compose.prod.yml 叠加使用，将 /opt/panji-live 下的运行时文件
# 只读挂载到容器内，实现代码热更新而无需重建镜像。
#
# 用法:
#   docker compose --env-file /etc/market-dev/market.env \
#     -f docker-compose.prod.yml -f docker-compose.live.yml up -d
#
# 挂载矩阵（使用 !override 覆盖 prod 的 volumes）:
#   backend + 所有 Python worker + capture worker:
#     /opt/panji-live/backend/app         → /app/app           (ro)
#     /opt/panji-live/backend/alembic     → /app/alembic       (ro)
#     /opt/panji-live/backend/alembic.ini → /app/alembic.ini   (ro)
#     /opt/panji-live/RUNTIME_SHA         → /app/RUNTIME_SHA   (ro)
#     /etc/market-dev/config.production.py → /app/config.production.py (ro)
#   backend 额外:
#     ./doc                                → /doc               (ro)
#   frontend:
#     /opt/panji-live/frontend/dist       → /usr/share/nginx/html (ro)
#     capture_static                      → /usr/share/nginx/html/static/captures (ro, 嵌套)
#
# 关键约束:
# - 所有挂载为只读 (:ro)，容器不得写入运行时文件
# - 不修改 docker-compose.prod.yml
# - config.production.py 挂到 /app/config.production.py（不嵌套到 /app/app），
#   避免与 /app/app 只读父挂载冲突；通过 environment 覆盖 CONFIG_FILE
# - 依赖/Dockerfile 变化仍需重建镜像
# - YAML 不允许同一 mapping 有多个 << merge key，故合并为单一 anchor

# 共享 Live Mount 配置（所有 Python 服务 + capture worker）
x-live-python: &live-python
  environment:
    CONFIG_FILE: /app/config.production.py
  volumes: !override
    - /opt/panji-live/backend/app:/app/app:ro
    - /opt/panji-live/backend/alembic:/app/alembic:ro
    - /opt/panji-live/backend/alembic.ini:/app/alembic.ini:ro
    - /opt/panji-live/RUNTIME_SHA:/app/RUNTIME_SHA:ro
    - /etc/market-dev/config.production.py:/app/config.production.py:ro

services:
  backend:
    <<: *live-python
    # backend 额外保留 ./doc 挂载，需用 !override 重新声明完整 volumes 列表
    volumes: !override
      - ./doc:/doc:ro
      - /opt/panji-live/backend/app:/app/app:ro
      - /opt/panji-live/backend/alembic:/app/alembic:ro
      - /opt/panji-live/backend/alembic.ini:/app/alembic.ini:ro
      - /opt/panji-live/RUNTIME_SHA:/app/RUNTIME_SHA:ro
      - /etc/market-dev/config.production.py:/app/config.production.py:ro

  worker-bars-scheduler:
    <<: *live-python

  worker-strategy-scheduler:
    <<: *live-python

  worker-calendar:
    <<: *live-python

  worker-monitor:
    <<: *live-python

  worker-strategy-batch:
    <<: *live-python

  worker-outbox:
    <<: *live-python

  worker-delivery:
    <<: *live-python

  worker-after-close:
    <<: *live-python

  worker-watchdog:
    <<: *live-python

  worker-capture:
    <<: *live-python

  frontend:
    volumes: !override
      - /opt/panji-live/frontend/dist:/usr/share/nginx/html:ro
      - capture_static:/usr/share/nginx/html/static/captures:ro
