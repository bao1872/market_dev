# V1.1 交易平台 - 生产环境 Docker Compose
# 包含多个服务：redis, backend, worker-*, frontend
# PostgreSQL 使用容器实例
# 用法: docker compose --env-file /etc/market-dev/market.env -f docker-compose.prod.yml up -d
#
# [CHANGE-20260718-003] json-file 日志轮转：所有服务复用 x-logging 锚点，
# 单容器上限 50m × 5 = 250MB，防止日志无限增长占满根盘。

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

# [CHANGE-20260804] 容器运行期资源硬预算（DS-101）：内存上限/预留、CPU、PID、优雅停止全部
# 环境变量可配置（默认保守宽松值，可在 /etc/market-dev/market.env 覆盖收紧）。
# 应用级长任务 memory_budget_mb 必须显著低于所在容器 mem_limit（见 rules/80 DS-107）。
# 轻量应用服务（scheduler / 轻 worker / watchdog）
x-resource-app-light: &resource-app-light
  mem_limit: ${PANJI_APP_LIGHT_MEM_LIMIT:-512m}
  mem_reservation: ${PANJI_APP_LIGHT_MEM_RESERVATION:-256m}
  cpus: ${PANJI_APP_LIGHT_CPUS:-1}
  pids_limit: ${PANJI_APP_LIGHT_PIDS_LIMIT:-512}
  stop_grace_period: ${PANJI_APP_LIGHT_STOP_GRACE:-30s}
# 重量应用服务（review / feature / stock core / 批量计算）
x-resource-app-heavy: &resource-app-heavy
  mem_limit: ${PANJI_APP_HEAVY_MEM_LIMIT:-1024m}
  mem_reservation: ${PANJI_APP_HEAVY_MEM_RESERVATION:-512m}
  cpus: ${PANJI_APP_HEAVY_CPUS:-1}
  pids_limit: ${PANJI_APP_HEAVY_PIDS_LIMIT:-1024}
  stop_grace_period: ${PANJI_APP_HEAVY_STOP_GRACE:-60s}
# 数据服务（postgres / redis / umami）
x-resource-data: &resource-data
  cpus: ${PANJI_DATA_CPUS:-1}
  pids_limit: ${PANJI_DATA_PIDS_LIMIT:-512}
  stop_grace_period: ${PANJI_DATA_STOP_GRACE:-60s}

services:
  # ===== PostgreSQL 数据库 =====
  postgres:
    image: postgres:16
    container_name: trading-postgres
    restart: unless-stopped
    logging: *default-logging
    <<: *resource-data
    mem_limit: ${PANJI_POSTGRES_MEM_LIMIT:-1536m}
    mem_reservation: ${PANJI_POSTGRES_MEM_RESERVATION:-1024m}
    cpus: ${PANJI_POSTGRES_CPUS:-2}
    pids_limit: ${PANJI_POSTGRES_PIDS_LIMIT:-512}
    stop_grace_period: ${PANJI_POSTGRES_STOP_GRACE:-60s}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-bz_stock}
      TZ: Asia/Shanghai
    volumes:
      - postgresdata:/var/lib/postgresql/data
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bz} -d ${POSTGRES_DB:-bz_stock}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ===== Redis 缓存 =====
  redis:
    image: redis:7-alpine
    container_name: trading-redis
    restart: unless-stopped
    logging: *default-logging
    <<: *resource-data
    mem_limit: ${PANJI_REDIS_MEM_LIMIT:-256m}
    mem_reservation: ${PANJI_REDIS_MEM_RESERVATION:-128m}
    cpus: ${PANJI_REDIS_CPUS:-1}
    pids_limit: ${PANJI_REDIS_PIDS_LIMIT:-256}
    stop_grace_period: ${PANJI_REDIS_STOP_GRACE:-30s}
    command: redis-server --appendonly yes
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===== 后端 API 服务 =====
  backend:
    build:
      context: ./backend
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        PYPROJECT_LOCK_HASH: ${PYPROJECT_LOCK_HASH:-unspecified}
    image: market-dev-backend:${GIT_SHA:-unknown}
    container_name: trading-backend
    restart: unless-stopped
    logging: *default-logging
    <<: *resource-app-heavy
    mem_limit: ${PANJI_BACKEND_MEM_LIMIT:-1024m}
    mem_reservation: ${PANJI_BACKEND_MEM_RESERVATION:-512m}
    cpus: ${PANJI_BACKEND_CPUS:-2}
    pids_limit: ${PANJI_BACKEND_PIDS_LIMIT:-1024}
    stop_grace_period: ${PANJI_BACKEND_STOP_GRACE:-30s}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://frontend}
      CAPTURE_WORKER_URL: ${CAPTURE_WORKER_URL:-http://worker-capture:8001}
      APP_ENV: production
      TZ: Asia/Shanghai
      CONFIG_FILE: /app/app/config.production.py
      # [CHANGE-20260730-010] Umami 访客分析：backend 通过独立只读连接查询 umami 数据库
      UMAMI_DATABASE_URL: ${UMAMI_DATABASE_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./doc:/doc:ro
      - /etc/market-dev/config.production.py:/app/app/config.production.py:ro
      # [CHANGE-20260730-010] goaccess_reports 挂载已移除：访问统计改用 Umami 数据库
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # ===== 行情调度 Worker =====
  worker-bars-scheduler:
    image: market-dev-backend:${GIT_SHA:-unknown}
    container_name: trading-worker-bars-scheduler
    restart: unless-stopped
    logging: *default-logging
    <<: *resource-app-light
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_ENV: production
      WORKER_TYPE: bars_scheduler
      TZ: Asia/Shanghai
      CONFIG_FILE: /app/app/config.production.py
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /etc/market-dev/config.production.py:/app/app/config.production.py:ro
    command: python -m app.worker

  # ===== 选股策略调度 Worker =====
  worker-strategy-scheduler:
    image: market-dev-backend:${GIT_SHA:-unknown}
    container_name: trading-worker-strategy-scheduler
    restart: unless-stopped
    logging: *default-logging
    <<: *resource-app-light
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_ENV: production
      WORKER_TYPE: strategy_scheduler
      TZ: Asia/Shanghai
      CONFIG_FILE: /app/app/config.production.py
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /etc/market-dev/config.production.py:/app/app/config.production.py:ro
    command: python -m app.worker

  # ===== 日历调度 Worker =====
  worker-calendar:
    image: market-dev-backend:${GIT_SHA:-unknown}
    container_name: trading-worker-calendar
    restart: unless-stopped
    logging: *default-logging
    <<: *resource-app-light
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_ENV: production
      WORKER_TYPE: calendar_scheduler
      TZ: Asia/Shanghai
      CONFIG_FILE: /app/app/config.production.py
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /etc/market-dev/config.production.py:/app/app/config.production.py:ro
    command: python -m app.worker

  # ===== 盘中监控 Worker =====
  worker-monitor:
    image: market-dev-backend:${GIT_SHA:-unknown}
    container_name: trading-worker-monitor
    restart: unless-stopped
    logging: *default-logging
    <<: *resource-app-light
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_ENV: production
      WORKER_TYPE: monitor_scheduler
      # [监控Worker地址] - 截图必须能访问前端容器，禁止默认 localhost:5173
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://frontend}
      CAPTURE_WORKER_URL: ${CAPTURE_WORKER_URL:-http://worker-capture:8001}
      TZ: Asia/Shanghai
      CONFIG_FILE: /app/app/config.production.py
      # [盘中监控1秒] - 事件判定Worker轮询间隔，默认1秒
      INTRADAY_MONITOR_POLL_SECONDS: ${INTRADAY_MONITOR_POLL_SECONDS:-1}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /etc/market-dev/config.production.py:/app/app/config.production.py:ro
    command: python -m app.worker

  # ===== 策略批量计算 Worker =====
  worker-strategy-batch:
    image: market-dev-backend:${GIT_SHA:-unknown}
    container_name: trading-worker-strategy-batch
    restart: unless-stopped
    logging: *default-logging
    <<: *resource-app-heavy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_ENV: production
      WORKER_TYPE: strategy_batch
      # [StrategyBatchService] - run 级总超时，默认 7200 秒与 after_close_orchestrator 对齐
      STRATEGY_RUN_TOTAL_TIMEOUT_SECONDS: ${STRATEGY_RUN_TOTAL_TIMEOUT_SECONDS:-7200}
      TZ: Asia/Shanghai
      CONFIG_FILE: /app/app/config.production.py
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /etc/market-dev/config.production.py:/app/app/config.production.py:ro
    command: python -m app.worker

  # ===== Outbox 扩张 Worker =====
  worker-outbox:
    image: market-dev-backend:${GIT_SHA:-unknown}
    container_name: trading-worker-outbox
    restart: unless-stopped
    logging: *default-logging
    <<: *resource-app-light
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_ENV: production
      WORKER_TYPE: outbox
      TZ: Asia/Shanghai
      CONFIG_FILE: /app/app/config.production.py
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /etc/market-dev/config.production.py:/app/app/config.production.py:ro
    command: python -m app.worker

  # ===== 投递 Worker =====
  worker-delivery:
    image: market-dev-backend:${GIT_SHA:-unknown}
    container_name: trading-worker-delivery
    restart: unless-stopped
    logging: *default-logging
    <<: *resource-app-light
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_ENV: production
      WORKER_TYPE: delivery
      TZ: Asia/Shanghai
      CONFIG_FILE: /app/app/config.production.py
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /etc/market-dev/config.production.py:/app/app/config.production.py:ro
    command: python -m app.worker

  # ===== 盘后编排 Worker（Phase5: 领取 queued 任务，断点恢复+心跳租约）=====
  worker-after-close:
    image: market-dev-backend:${GIT_SHA:-unknown}
    container_name: trading-worker-after-close
    restart: unless-stopped
    logging: *default-logging
    <<: *resource-app-heavy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_ENV: production
      WORKER_TYPE: after_close_orchestrator
      WORKER_INTERVAL: "5"
      # [盘后Worker地址] - 未来如需截图，必须能访问前端容器
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://frontend}
      CAPTURE_WORKER_URL: ${CAPTURE_WORKER_URL:-http://worker-capture:8001}
      TZ: Asia/Shanghai
      CONFIG_FILE: /app/app/config.production.py
      # [CHANGE-20260716-007] 板块同步开关：盘后编排读取此环境变量决定是否执行 syncing_boards
      # 由 market.env 中 BOARD_SYNC_ENABLED 控制，默认 false
      BOARD_SYNC_ENABLED: ${BOARD_SYNC_ENABLED:-false}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /etc/market-dev/config.production.py:/app/app/config.production.py:ro
    command: python -m app.worker

  # ===== 恢复看门狗 Worker =====
  worker-watchdog:
    image: market-dev-backend:${GIT_SHA:-unknown}
    container_name: trading-worker-watchdog
    restart: unless-stopped
    logging: *default-logging
    <<: *resource-app-light
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_ENV: production
      WORKER_TYPE: watchdog
      TZ: Asia/Shanghai
      CONFIG_FILE: /app/app/config.production.py
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /etc/market-dev/config.production.py:/app/app/config.production.py:ro
    command: python -m app.worker

  # ===== 截图 Worker =====
  worker-capture:
    build:
      context: ./backend
      dockerfile: Dockerfile.capture
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: market-dev-capture:${GIT_SHA:-unknown}
    container_name: trading-worker-capture
    restart: unless-stopped
    logging: *default-logging
    <<: *resource-app-heavy
    mem_limit: ${PANJI_CAPTURE_MEM_LIMIT:-768m}
    mem_reservation: ${PANJI_CAPTURE_MEM_RESERVATION:-384m}
    cpus: ${PANJI_CAPTURE_CPUS:-2}
    pids_limit: ${PANJI_CAPTURE_PIDS_LIMIT:-512}
    stop_grace_period: ${PANJI_CAPTURE_STOP_GRACE:-60s}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CAPTURE_HOST: 0.0.0.0
      CAPTURE_PORT: 8001
      CAPTURE_STATIC_DIR: /app/static/captures
      CAPTURE_STATIC_URL_PREFIX: /static/captures
      APP_ENV: production
      TZ: Asia/Shanghai
      # [PROMPT.md §5.3 V2] 移动舞台 1440×2560 渲染较慢，超时从 30s 提升到 90s
      CAPTURE_RENDER_TIMEOUT_MS: "90000"
      CAPTURE_SCREENSHOT_TIMEOUT_MS: "20000"
    volumes:
      - capture_static:/app/static/captures
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===== 前端 Nginx 服务 =====
  frontend:
    build:
      context: ./frontend
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        VITE_GIT_SHA: ${VITE_GIT_SHA:-dev}
        VITE_BUILD_TIME: ${VITE_BUILD_TIME:-unknown}
    image: market-dev-frontend:${GIT_SHA:-dev}
    container_name: trading-frontend
    restart: unless-stopped
    logging: *default-logging
    <<: *resource-app-light
    mem_limit: ${PANJI_FRONTEND_MEM_LIMIT:-128m}
    mem_reservation: ${PANJI_FRONTEND_MEM_RESERVATION:-64m}
    cpus: ${PANJI_FRONTEND_CPUS:-1}
    pids_limit: ${PANJI_FRONTEND_PIDS_LIMIT:-256}
    stop_grace_period: ${PANJI_FRONTEND_STOP_GRACE:-20s}
    environment:
      TZ: Asia/Shanghai
      # [CHANGE-20260729-009] Umami tracking script 注入控制
      # - 非空时 docker-entrypoint.sh 向 index.html 注入 <script src="/umami/script.js">
      # - 空时跳过注入（dev/capture 模式不统计）
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    depends_on:
      - backend
    volumes:
      - capture_static:/usr/share/nginx/html/static/captures:ro
      # [Gate5] GoAccess 共享日志卷：nginx 写入 access.log，goaccess 容器只读挂载
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"

  # ===== [CHANGE-20260729-009] Umami 访客分析服务（替代 GoAccess） =====
  # 职责：访客分析、pageview、来源统计、设备/浏览器分析
  # 设计：
  # - 复用现有 trading-postgres 容器，独立 umami 数据库和用户（与 bz_stock 隔离）
  # - env_file 引用 /etc/market-dev/umami.env（含 DATABASE_URL + APP_SECRET）
  # - 仅内部网络访问，不暴露公网端口（通过 frontend nginx /umami/ 反向代理）
  # - 前端 production 注入 tracking script（docker-entrypoint.sh 控制）
  # - 开发/capture 模式不注入（不统计）
  # - 保留 nginx access.log 和轮转（logrotate-nginx），不再依赖 GoAccess 解析 access.log
  umami:
    image: docker.umami.is/umami-software/umami:3.2
    container_name: trading-umami
    restart: unless-stopped
    logging: *default-logging
    <<: *resource-data
    mem_limit: ${PANJI_UMAMI_MEM_LIMIT:-384m}
    mem_reservation: ${PANJI_UMAMI_MEM_RESERVATION:-128m}
    cpus: ${PANJI_UMAMI_CPUS:-1}
    pids_limit: ${PANJI_UMAMI_PIDS_LIMIT:-512}
    stop_grace_period: ${PANJI_UMAMI_STOP_GRACE:-60s}
    env_file:
      - /etc/market-dev/umami.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    volumes:
      - umami_data:/app/data
    networks:
      - default

  # [CHANGE-20260729-009] GoAccess 服务已移除：访客分析改用 Umami
  # 保留 nginx access.log 和 logrotate 轮转（由 frontend 容器内 crond 处理）
  # goaccess_reports volume 暂保留供回滚，后续可清理

volumes:
  postgresdata:
    name: trading-postgresdata
  redisdata:
    name: trading-redisdata
  capture_static:
    name: trading-capture-static
  # [Gate5] Nginx access.log 共享卷（frontend 写，保留供运维诊断）
  nginx_logs:
    name: trading-nginx-logs
  # [CHANGE-20260730-010] goaccess_reports volume 已移除：访问统计改用 Umami 数据库
  # [CHANGE-20260729-009] Umami 数据卷（暂存上传/会话，主数据在 Postgres umami 库）
  umami_data:
    name: trading-umami-data
