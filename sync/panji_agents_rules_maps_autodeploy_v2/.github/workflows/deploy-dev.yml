name: Deploy dev to Tencent

on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: panji-dev-deploy
  cancel-in-progress: false

jobs:
  quick-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate target SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]

      - name: Knowledge and deployment classification
        shell: bash
        run: |
          set -Eeuo pipefail
          python tools/check_knowledge_system.py
          python scripts/deploy/classify_deployment.py \
            --base "${{ github.event.before }}" \
            --target "${GITHUB_SHA}" \
            --output /tmp/deploy-classification.json
          cat /tmp/deploy-classification.json

      - name: Frontend build gate
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --name-only "${{ github.event.before }}" "${GITHUB_SHA}" \
            | grep -q '^frontend/'; then
            cd frontend
            npm ci
            npm run build
          fi

  deploy:
    needs: quick-check
    runs-on: ubuntu-latest
    environment: tencent-dev
    steps:
      - name: Install SSH key
        env:
          DEPLOY_KEY: ${{ secrets.TENCENT_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.TENCENT_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.TENCENT_DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/panji_deploy
          chmod 600 ~/.ssh/panji_deploy
          ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" \
            >> ~/.ssh/known_hosts

      - name: Trigger fixed server deployment
        env:
          DEPLOY_HOST: ${{ secrets.TENCENT_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.TENCENT_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.TENCENT_DEPLOY_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i ~/.ssh/panji_deploy \
            -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "${GITHUB_SHA}"
