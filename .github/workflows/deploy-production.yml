name: Deploy Production

on:
  # CI 成功后自动部署 main 分支
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # 手动指定 SHA 部署（必须属于 main）
  workflow_dispatch:
    inputs:
      sha:
        description: "要部署的 main 分支 commit SHA（完整或短 SHA）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to panji-prod
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Determine deploy SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PANJI_PROD_HOST }}
          username: ${{ secrets.PANJI_PROD_USER }}
          key: ${{ secrets.PANJI_PROD_SSH_KEY }}
          script_stop: true
          script: |
            /usr/local/bin/panji-deploy.sh "${{ steps.sha.outputs.value }}"
