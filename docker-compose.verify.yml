# V2.1 远程验证栈 Compose（DS-111，Corrective Pass 2 修正）
# 修复 P0-6/P0-7：
#   - Redis 方案 B：独立 verify-redis，所有验证服务统一连接 redis://verify-redis:6379/0
#   - 接入正式 PostgreSQL 所在 external network（market-dev-default），使 trading-postgres 可解析
# 独立 project 名 panji-verify；端口仅绑定 127.0.0.1；自动 Scheduler 关闭；只启动必要 Worker。
#
# 用法（在 panji-prod 的 /root/web_dev_verify 内，由远程脚本调用）：
#   docker compose -p panji-verify --env-file market.verify.env -f docker-compose.verify.yml up -d
#
# 注意：postgres 声明为 external（复用 trading-postgres 容器），验证库 bz_stock_verify_<sha>。

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-resource-app-light: &resource-app-light
  mem_limit: 512m
  mem_reservation: 256m
  cpus: 1
  pids_limit: 512
  stop_grace_period: 30s

x-resource-app-heavy: &resource-app-heavy
  mem_limit: 1024m
  mem_reservation: 512m
  cpus: 1
  pids_limit: 1024
  stop_grace_period: 60s

networks:
  # 复用正式 PostgreSQL 所在网络，使验证服务可解析 trading-postgres
  market-dev-default:
    external: true
  # 验证栈内部网络（verify-redis + 各验证服务）
  panji-verify-internal:
    driver: bridge

services:
  # 独立验证 Redis（方案 B：隔离更清楚，不暴露宿主机端口）
  verify-redis:
    image: redis:7-alpine
    container_name: verify-redis
    logging: *default-logging
    command: redis-server --appendonly yes --port 6379
    networks:
      - panji-verify-internal
    # 不暴露宿主机端口（仅验证栈内部访问）

  # 验证 backend
  verify-backend:
    image: market-dev-backend:${GIT_SHA:?GIT_SHA is required}
    container_name: verify-backend
    logging: *default-logging
    <<: *resource-app-heavy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL (bz_stock_verify_<sha>) is required}
      REDIS_URL: ${REDIS_URL:-redis://verify-redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_ENV: verification
      TZ: Asia/Shanghai
      CONFIG_FILE: /app/app/config.production.py
      PANJI_SCHEDULER_ENABLED: "false"
      FRONTEND_BASE_URL: http://verify-frontend
      CAPTURE_WORKER_URL: http://verify-worker-capture:8001
    depends_on:
      - verify-redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - market-dev-default
      - panji-verify-internal
    ports:
      - "127.0.0.1:8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  verify-frontend:
    image: market-dev-frontend:${GIT_SHA:?GIT_SHA is required}
    container_name: verify-frontend
    logging: *default-logging
    <<: *resource-app-light
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000
    networks:
      - panji-verify-internal
    ports:
      - "127.0.0.1:8080:80"

  # 必要 Worker（不复用正式 Worker 容器，独立实例）
  verify-worker-after-close:
    image: market-dev-backend:${GIT_SHA:?GIT_SHA is required}
    container_name: verify-worker-after-close
    logging: *default-logging
    <<: *resource-app-light
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://verify-redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_ENV: verification
      WORKER_TYPE: after_close
      TZ: Asia/Shanghai
      PANJI_SCHEDULER_ENABLED: "false"
    depends_on:
      - verify-redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - market-dev-default
      - panji-verify-internal
    command: python -m app.worker

  verify-worker-chip:
    image: market-dev-backend:${GIT_SHA:?GIT_SHA is required}
    container_name: verify-worker-chip
    logging: *default-logging
    <<: *resource-app-light
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://verify-redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_ENV: verification
      WORKER_TYPE: chip
      TZ: Asia/Shanghai
    depends_on:
      - verify-redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - market-dev-default
      - panji-verify-internal
    command: python -m app.worker

  verify-worker-watchdog:
    image: market-dev-backend:${GIT_SHA:?GIT_SHA is required}
    container_name: verify-worker-watchdog
    logging: *default-logging
    <<: *resource-app-light
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://verify-redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_ENV: verification
      WORKER_TYPE: watchdog
      TZ: Asia/Shanghai
    depends_on:
      - verify-redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - market-dev-default
      - panji-verify-internal
    command: python -m app.worker
