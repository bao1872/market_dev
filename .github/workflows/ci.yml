name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 生产环境所有服务使用 Asia/Shanghai 时区，CI runner 需保持一致，
# 避免 datetime.now()/date.today() 在 UTC 下产生与生产不同的结果。
env:
  TZ: Asia/Shanghai

jobs:
  architecture-rules:
    name: Architecture Rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: pip install -e "backend[dev]"
      - name: Run architecture rules checks
        run: python tools/check_architecture.py

  docs-consistency:
    name: Docs Consistency
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: pip install -e "backend[dev]"
      - name: Run docs consistency checks
        run: python tools/check_docs_consistency.py

  test-allowlist:
    name: Test Allowlist
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: pip install -e "backend[dev]"
      - name: Run test allowlist checks
        run: python tools/check_test_allowlist.py

  governance-rules:
    name: Governance Rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: "[Phase 5B-0] Verify ref/ and sync/ are not tracked"
        run: |
          tracked=$(git ls-files ref sync)
          if [ -n "$tracked" ]; then
            echo "ERROR: ref/ or sync/ files are tracked in git:"
            echo "$tracked"
            exit 1
          fi
          echo "OK: ref/ and sync/ are not tracked"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: pip install -e "backend[dev]"
      - name: Run governance rules checks
        run: python tools/check_governance_rules.py

  ruff-new-files:
    name: Ruff New Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: pip install -e "backend[dev]"
      - name: Run ruff on new Python files only
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            # 处理初次 push 或空 before SHA，不允许静默跳过
            if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              if git rev-parse HEAD~1 >/dev/null 2>&1; then
                BASE_SHA=$(git rev-parse HEAD~1)
              else
                BASE_SHA=$(git rev-parse HEAD)
              fi
            fi
          fi

          echo "BASE_SHA=$BASE_SHA"
          echo "HEAD_SHA=$HEAD_SHA"

          NEW_BACKEND_FILES=$(git diff --name-only --diff-filter=A "$BASE_SHA" "$HEAD_SHA" -- 'backend/*.py' 'backend/**/*.py' | sed 's|^backend/||' | tr '\n' ' ' || true)
          NEW_ROOT_TOOLS=$(git diff --name-only --diff-filter=A "$BASE_SHA" "$HEAD_SHA" -- 'tools/*.py' 'tools/**/*.py' | sed 's|^|../|' | tr '\n' ' ' || true)

          cd backend

          if [ -n "$NEW_BACKEND_FILES" ]; then
            echo "New backend Python files:"
            echo "$NEW_BACKEND_FILES"
            ruff check $NEW_BACKEND_FILES
          else
            echo "No new backend Python files."
          fi

          if [ -n "$NEW_ROOT_TOOLS" ]; then
            echo "New root tools Python files:"
            echo "$NEW_ROOT_TOOLS"
            ruff check --config pyproject.toml $NEW_ROOT_TOOLS
          else
            echo "No new root tools Python files."
          fi

  ruff-baseline-regression:
    name: Ruff Baseline Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: pip install -e "backend[dev]"
      - name: Run ruff and compare with baseline
        working-directory: backend
        run: |
          set -euo pipefail
          ruff check . --output-format=json --output-file=ruff-full-report.json || true
          python ../tools/compare_ruff_baseline.py ruff-full-report.json ../tools/quality_baselines/ruff.json

  ruff-full-repository-report:
    name: Ruff Full Repository Report
    runs-on: ubuntu-latest
    # 该任务仅展示历史债务总数并上传报告，不阻断合并；新增债务由 Ruff Baseline Regression 任务判断。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: pip install -e "backend[dev]"
      - name: Run ruff on full repository and upload report
        working-directory: backend
        run: |
          set +e
          ruff check . --output-format=json --output-file=ruff-full-report.json
          EXIT_CODE=$?
          COUNT=$(jq '. | length' ruff-full-report.json)
          echo "Ruff full repository raw error count: $COUNT"
          echo "This is historical debt; new debt is blocked by Ruff New Files and Ruff Baseline Regression."
          exit $EXIT_CODE
      - name: Upload ruff full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-full-report
          path: backend/ruff-full-report.json

  mypy-new-files:
    name: Mypy New Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: pip install -e "backend[dev]"
      - name: Determine base and head SHAs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            BASE_SHA="${{ github.event.before }}"
            if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              if git rev-parse HEAD~1 >/dev/null 2>&1; then
                BASE_SHA=$(git rev-parse HEAD~1)
              else
                BASE_SHA=$(git rev-parse HEAD)
              fi
            fi
            echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
            echo "HEAD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          fi
      - name: Run mypy on backend
        working-directory: backend
        run: |
          set +e
          mypy app \
            --output json \
            --show-error-codes \
            --no-error-summary \
            --hide-error-context \
            --no-pretty \
            > mypy-report.jsonl
          EXIT_CODE=$?
          COUNT=$(jq -s 'length' mypy-report.jsonl)
          echo "Mypy raw error count: $COUNT (historical debt; new files checked next)"
          exit 0
      - name: Check new app files for mypy errors
        run: python tools/check_mypy_new_files.py "$BASE_SHA" "$HEAD_SHA" backend/mypy-report.jsonl

  mypy-baseline-regression:
    name: Mypy Baseline Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: pip install -e "backend[dev]"
      - name: Run mypy on backend
        working-directory: backend
        run: |
          set +e
          mypy app \
            --output json \
            --show-error-codes \
            --no-error-summary \
            --hide-error-context \
            --no-pretty \
            > mypy-report.jsonl
          EXIT_CODE=$?
          COUNT=$(jq -s 'length' mypy-report.jsonl)
          echo "Mypy raw error count: $COUNT (compared to baseline next)"
          exit 0
      - name: Compare with mypy baseline
        run: python tools/compare_mypy_baseline.py backend/mypy-report.jsonl tools/quality_baselines/mypy.json
      - name: Upload mypy baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-baseline-report
          path: backend/mypy-report.jsonl

  mypy-full-report:
    name: Mypy Full Repository Report
    runs-on: ubuntu-latest
    # 该任务仅展示历史债务总数并上传报告，不阻断合并；新增债务由 Mypy New Files 和 Mypy Baseline Regression 任务判断。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: pip install -e "backend[dev]"
      - name: Run mypy on full repository and upload report
        working-directory: backend
        run: |
          set +e
          mypy app \
            --output json \
            --show-error-codes \
            --no-error-summary \
            --hide-error-context \
            --no-pretty \
            > mypy-full-report.jsonl
          EXIT_CODE=$?
          COUNT=$(jq -s 'length' mypy-full-report.jsonl)
          echo "Mypy full repository raw error count: $COUNT"
          echo "This is historical debt; new debt is blocked by Mypy New Files and Mypy Baseline Regression."
          exit $EXIT_CODE
      - name: Upload mypy full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-full-report
          path: backend/mypy-full-report.jsonl

  alembic-cycle:
    name: Alembic Upgrade / Downgrade / Upgrade
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bz
          POSTGRES_PASSWORD: bz
          POSTGRES_DB: bz_stock_test
          TZ: Asia/Shanghai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://bz:bz@localhost:5432/bz_stock_test
      TEST_DATABASE_URL: postgresql+asyncpg://bz:bz@localhost:5432/bz_stock_test
      # [Phase 5B-2] config.py requires REDIS_URL at import time (fail-closed);
      # CI doesn't run Redis, but APP_ENV=test skips DB!=0 validation.
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: pip install -e ".[dev]"
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U bz && break
            sleep 1
          done
      - name: Alembic upgrade head
        run: alembic upgrade head
      - name: Alembic downgrade base
        run: alembic downgrade base
      - name: Alembic upgrade head again
        run: alembic upgrade head

  postgres-integration-tests:
    # [CHANGE-20260731-002] PG 集成测试独立运行，不再依赖 Ruff/Mypy
    # - 自行执行 Migration（conftest.py session fixture 调用 alembic upgrade head）
    # - 失败阻塞 CI Gate，但不再因 Ruff/Mypy 失败而被 skipped
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bz
          POSTGRES_PASSWORD: bz
          POSTGRES_DB: bz_stock_test
          TZ: Asia/Shanghai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+asyncpg://bz:bz@localhost:5432/bz_stock_test
      # [Phase 5B-2] config.py requires REDIS_URL at import time (fail-closed);
      # CI doesn't run Redis, but APP_ENV=test skips DB!=0 validation.
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: pip install -e ".[dev]"
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U bz && break
            sleep 1
          done
      - name: Run pytest (includes Migration via conftest session fixture)
        # --junitxml + 解析后输出 ::error:: annotation，便于无 admin 权限下查看失败用例
        # 修复：原 `python3 - <<'PY' < pytest.xml` 因 here-doc 与文件重定向冲突，
        # Python 把 pytest.xml 当成脚本解析，annotation 永远不会发出。
        # 改用 `-c` 内联脚本 + 独立 stdin 重定向。
        run: |
          set +e
          pytest --tb=short -v --junitxml=pytest.xml > pytest_output.txt 2>&1
          pytest_exit=$?
          cat pytest_output.txt
          # 解析 pytest.xml 提取失败用例，输出为 GitHub annotation（公开 API 可读）
          if [ "$pytest_exit" -ne 0 ] && [ -f pytest.xml ]; then
            python3 -c "
          import sys, xml.etree.ElementTree as ET
          try:
              tree = ET.parse('pytest.xml')
              root = tree.getroot()
              n_fail = 0
              for tc in root.iter('testcase'):
                  for child in tc:
                      if child.tag in ('failure', 'error'):
                          name = tc.get('name', '?')
                          classname = tc.get('classname', '?')
                          msg = (child.get('message') or child.text or '')[:500]
                          print(f'::error file={classname},title={name}::{name}: {msg}')
                          n_fail += 1
              if n_fail == 0:
                  print('::error::pytest exited non-zero but no <failure>/<error> tags found in pytest.xml; check raw output above')
          except Exception as e:
              print(f'::error::failed to parse pytest.xml: {e}')
          "
            # 兜底：从 pytest_output.txt 提取 FAILED/ERROR 行
            grep -E '^(FAILED|ERROR)' pytest_output.txt 2>/dev/null | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $pytest_exit
      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-pg-results
          path: backend/pytest.xml
          retention-days: 7

  frontend-tsc:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run TypeScript check
        run: npx tsc --noEmit

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs:
      - frontend-tsc
      - frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  frontend-contract-tests:
    # [CP-17] 前端契约测试纳入 CI 门禁
    # - 使用 Node 22（PRD V2.0 Phase 4.1 要求干净 Node 22 环境）
    # - 必须在仓库根目录运行（测试文件读取 ../backend/app/contracts/*.json）
    # - 失败阻塞 merge（禁止标记 pre-existing 后跳过）
    name: Frontend Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run contract tests
        run: npm run test:contract

  frontend-e2e:
    # [CP-18] 最小 Playwright E2E 纳入 CI 门禁
    # - 仅 chromium，workers=1 串行执行（资源约束）
    # - webServer 自动构建并启动 vite preview（playwright.config.ts 管理）
    # - 失败阻塞 merge；通过条件：22 个测试全部 pass
    # - 不依赖生产数据：所有 API 由 page.route() 拦截返回 fixture
    name: Frontend Playwright E2E
    runs-on: ubuntu-latest
    needs:
      - frontend-build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        run: npm run test:e2e
        env:
          CI: "true"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/

  ci-gate:
    # [CHANGE-20260731-002] CI Gate — 唯一阻断 Job
    # - if: always() 确保即使前置 Job 失败也运行
    # - 部署只认 CI Gate=success，不得根据单个 Job 或本地测试代替
    # - Ruff/Mypy Full Repository Report 为报告型任务，不纳入 CI Gate
    # - PG Job 被 skipped 视为 CI 失败
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - architecture-rules
      - docs-consistency
      - test-allowlist
      - governance-rules
      - ruff-new-files
      - ruff-baseline-regression
      - mypy-new-files
      - mypy-baseline-regression
      - alembic-cycle
      - postgres-integration-tests
      - frontend-tsc
      - frontend-lint
      - frontend-build
      - frontend-contract-tests
      - frontend-e2e
    steps:
      - name: Evaluate CI Gate
        shell: bash
        run: |
          set -euo pipefail

          # 阻断 Job 列表（与 needs 一致）
          declare -A JOBS=(
            ["architecture-rules"]="${{ needs.architecture-rules.result }}"
            ["docs-consistency"]="${{ needs.docs-consistency.result }}"
            ["test-allowlist"]="${{ needs.test-allowlist.result }}"
            ["governance-rules"]="${{ needs.governance-rules.result }}"
            ["ruff-new-files"]="${{ needs.ruff-new-files.result }}"
            ["ruff-baseline-regression"]="${{ needs.ruff-baseline-regression.result }}"
            ["mypy-new-files"]="${{ needs.mypy-new-files.result }}"
            ["mypy-baseline-regression"]="${{ needs.mypy-baseline-regression.result }}"
            ["alembic-cycle"]="${{ needs.alembic-cycle.result }}"
            ["postgres-integration-tests"]="${{ needs.postgres-integration-tests.result }}"
            ["frontend-tsc"]="${{ needs.frontend-tsc.result }}"
            ["frontend-lint"]="${{ needs.frontend-lint.result }}"
            ["frontend-build"]="${{ needs.frontend-build.result }}"
            ["frontend-contract-tests"]="${{ needs.frontend-contract-tests.result }}"
            ["frontend-e2e"]="${{ needs.frontend-e2e.result }}"
          )

          echo "================================================"
          echo "CI Gate — 阻断 Job 结果汇总"
          echo "================================================"
          FAILED=0
          SKIPPED=0
          for name in "${!JOBS[@]}"; do
            result="${JOBS[$name]}"
            echo "  $name: $result"
            if [ "$result" != "success" ]; then
              if [ "$result" == "skipped" ]; then
                SKIPPED=$((SKIPPED + 1))
              fi
              FAILED=$((FAILED + 1))
            fi
          done
          echo "================================================"
          echo "Failed/Non-success: $FAILED"
          echo "Skipped: $SKIPPED"
          echo "================================================"

          # PG Job 被 skipped 视为 CI 失败（不写 "PG未确认"）
          if [ "${JOBS[postgres-integration-tests]}" == "skipped" ]; then
            echo "ERROR: postgres-integration-tests was SKIPPED — treated as CI failure"
            exit 1
          fi

          # 任何阻断 Job 不是 success 即失败
          if [ "$FAILED" -gt 0 ]; then
            echo "ERROR: $FAILED blocking job(s) did not succeed"
            exit 1
          fi

          echo "CI Gate PASSED — all blocking jobs succeeded"
