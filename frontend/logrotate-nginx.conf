# [CHANGE-20260729-005 五.4] Nginx access.log / error.log 轮转配置
# 问题：Docker json-file 只轮转容器 stdout/stderr，不轮转命名卷内 /var/log/nginx/access.log
# 方案：在 frontend (nginx:alpine) 容器内运行 logrotate，避免新增常驻 sidecar
# 策略：daily + maxsize 50M 双触发；保留 7 份；压缩；copytruncate 无需 nginx reopen 信号
/var/log/nginx/access.log /var/log/nginx/error.log {
    daily
    maxsize 50M
    rotate 7
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
    dateext
    dateformat -%Y%m%d-%H%M%S
}
