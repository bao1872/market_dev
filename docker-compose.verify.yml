# V2.2 远程验证栈 Compose（CHANGE-20260806-012, 减法重构）
#
# 设计目标：单可复用验证运行时。
#   - 只有一个长期容器 panji-verify-python（常驻空闲，禁 Scheduler/Worker/Uvicorn/pytest/seed）
#   - 复用已有 trading-postgres（验证库 bz_stock_verify_<SHA>，DS-110）
#   - 复用已有 trading-redis 网络连通性（本轮 verification 实际不连 Redis，见 CHANGE-012 审计结论）
#   - 不再启动 verify-backend / verify-frontend / verify-worker-* / verify-redis / verify-test
#   - 固定 project 名 panji-verify；不发布 host port；不依赖 VERIFY_TEST_IMAGE 等旧 topology 变量
#   - attempt 变量经 /run/panji-verify/attempt.env 由 verify_exec.py 动态注入每个 fresh process
#
# 用法（在 panji-prod 的 /root/web_dev_verify 内，由 run_remote_verification.sh 调用）：
#   docker compose -p panji-verify -f docker-compose.verify.yml up -d verify-python

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-resource-app-heavy: &resource-app-heavy
  mem_limit: 4g
  mem_reservation: 2g
  cpus: 2
  pids_limit: 1024
  stop_grace_period: 60s

# Live Mount：验证代码目录只读挂载（VERIFY_CODE_DIR 由 run_remote_verification.sh 注入，固定 /root/web_dev_verify）
x-verify-live-python: &verify-live-python
  volumes:
    - ${VERIFY_CODE_DIR:?VERIFY_CODE_DIR is required}/backend/app:/app/app:ro
    - ${VERIFY_CODE_DIR:?VERIFY_CODE_DIR is required}/backend/alembic:/app/alembic:ro
    - ${VERIFY_CODE_DIR:?VERIFY_CODE_DIR is required}/backend/alembic.ini:/app/alembic.ini:ro
    - ${VERIFY_CODE_DIR:?VERIFY_CODE_DIR is required}/backend/tests:/app/tests:ro
    - ${VERIFY_CODE_DIR:?VERIFY_CODE_DIR is required}/backend/pyproject.toml:/app/pyproject.toml:ro
    - ${VERIFY_CODE_DIR:?VERIFY_CODE_DIR is required}/scripts/verify:/app/scripts/verify:ro
    # 固定 runtime 控制路径：RUNTIME_SHA + attempt.env（只读 mount 进容器）
    - ${VERIFY_RUNTIME_DIR:?VERIFY_RUNTIME_DIR is required}:/run/panji-verify/:ro
    - /etc/market-dev/config.production.py:/app/config.production.py:ro

networks:
  # 复用正式 PostgreSQL 所在网络，使验证服务可解析 trading-postgres
  # 网络名由 VERIFY_PG_NETWORK 提供（由 prepare_verify_environment.py 实测后注入到 attempt.env）
  verify-pg-network:
    external: true
    name: ${VERIFY_PG_NETWORK:?VERIFY_PG_NETWORK is required}

services:
  # 唯一长期验证容器：panji-verify-python
  # - 常驻空闲（sleep infinity），禁 Scheduler/Worker/Uvicorn/pytest/seed
  # - 每个 gate 由 verify_exec.py 以 fresh process 执行（docker exec）
  # - 异常恢复：docker restart panji-verify-python（杀容器所有验证进程，不删 infra）
  verify-python:
    image: panji-verify-runtime:current
    # 固定容器名：run_remote_verification.sh 与 verify_attempt.py 均以此名 docker exec/restart
    container_name: panji-verify-python
    logging: *default-logging
    <<: [*resource-app-heavy, *verify-live-python]
    # 容器常驻 env 只持有稳定变量；attempt-specific 变量由 verify_exec.py 动态注入
    environment:
      APP_ENV: verification
      PANJI_SCHEDULER_ENABLED: "false"
      TZ: Asia/Shanghai
      CONFIG_FILE: /app/config.production.py
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - verify-pg-network
    command: sleep infinity
    restart: "no"
