# CI — 手动触发的诊断工具（CHANGE-20260802-003 配套）
#
# 定位：CI **不是**部署前置门禁，也**不是** dev 的自动检查。
#   - 唯一触发方式为 workflow_dispatch（手动）；
#   - push dev / PR 均不触发，避免把 CI 变成事实上的发布流程；
#   - 部署是否执行由 scripts/ops/panji-test-deploy + 人工判断决定，与本 workflow 无耦合。
#
# 职责：
#   - changes job 依据 git diff 输出 docs/backend/frontend/db/migration/deploy 标志；
#   - 始终运行：architecture / docs-consistency / governance / test-allowlist；
#   - 仅相关范围运行后端 / 前端 / PG / Migration 测试；
#   - 不相关 job 允许 skipped，且不计入 CI Gate 失败（依据 changes 输出，非 IDE 判断）；
#   - 不运行完整 Playwright / 全 pytest / 全 base cycle / 全仓 Ruff/Mypy 报告。
#
# 名称保持 "CI"、Gate 名称保持 "CI Gate"，以兼容既有引用。
name: CI

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: "可选：用于范围分类的基线完整 SHA；为空时使用目标 SHA 的第一父提交"
        required: false
        type: string

concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai

jobs:
  # ---------------------------------------------------------------------------
  # changes：唯一负责输出变更范围。其他 job 的 if 依据本 job 输出。
  # 不使用第三方 action，纯 git diff 计算，避免网络/认证依赖。
  # ---------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      docs_changed: ${{ steps.filter.outputs.docs_changed }}
      backend_changed: ${{ steps.filter.outputs.backend_changed }}
      frontend_changed: ${{ steps.filter.outputs.frontend_changed }}
      db_changed: ${{ steps.filter.outputs.db_changed }}
      migration_changed: ${{ steps.filter.outputs.migration_changed }}
      deploy_changed: ${{ steps.filter.outputs.deploy_changed }}
      base_sha: ${{ steps.shas.outputs.BASE }}
      head_sha: ${{ steps.shas.outputs.HEAD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute base/head SHAs
        id: shas
        run: |
          set -euo pipefail
          HEAD="${{ github.sha }}"
          BASE="${{ inputs.base_sha }}"
          if [ -z "$BASE" ]; then
            BASE=$(git rev-parse "$HEAD^" 2>/dev/null || printf '%s' "$HEAD")
          fi
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" "$HEAD"
          echo "BASE=$(git rev-parse "$BASE^{commit}")" >> "$GITHUB_OUTPUT"
          echo "HEAD=$(git rev-parse "$HEAD^{commit}")" >> "$GITHUB_OUTPUT"
      - name: Classify changed files
        id: filter
        run: |
          set -euo pipefail
          BASE="${{ steps.shas.outputs.BASE }}"
          HEAD="${{ steps.shas.outputs.HEAD }}"
          echo "BASE=$BASE HEAD=$HEAD"
          FILES=$(git diff --name-only "$BASE" "$HEAD" || true)
          echo "$FILES" | tr '\n' ' '
          has() { echo "$FILES" | grep -Eq "$1"; }

          docs=$(has '^(docs/|rules/|README|CHANGE|AGENTS)' && echo true || echo false)
          frontend=$(has '^frontend/' && echo true || echo false)
          migration=$(has '^backend/alembic/' && echo true || echo false)
          deploy=$(has '^(scripts/ops/|\.github/|docker-compose|Dockerfile|backend/Dockerfile)' && echo true || echo false)

          # backend：任何后端 Python 源码或测试变更（含 pyproject/依赖）。
          backend=$(has '^backend/.*\.py$|^backend/pyproject\.toml$' && echo true || echo false)

          # db：是否需要起真实 Postgres 容器。
          #
          # 实测（2026-08-02）：218 个测试文件中有 113 个依赖真实 PG，覆盖 app/models/
          # services/domain/api 等几乎全部后端目录，因此无法按子目录进一步收窄——
          # 任何后端源码变更都可能影响 PG 集成测试。这里如实反映该耦合，
          # 而不是用更细的路径规则制造「已收窄」的假象。
          #
          # 收益来自另一维度：db_changed 为 false 时（纯文档/纯前端/纯部署脚本变更）
          # 完全不起 Postgres 容器；且 PG job 只跑 `-m postgres`（1178 条），
          # 不再像旧 CI 那样在 PG 容器里跑整套 3674 条。
          db=$(has '^backend/(app|models|alembic)/.*\.py$|^backend/tests/.*\.py$' && echo true || echo false)
          # migration 变更必然涉及库结构，强制纳入 db 范围。
          if [ "$migration" = "true" ]; then db=true; fi
          {
            echo "docs_changed=$docs"
            echo "backend_changed=$backend"
            echo "frontend_changed=$frontend"
            echo "db_changed=$db"
            echo "migration_changed=$migration"
            echo "deploy_changed=$deploy"
          } >> "$GITHUB_OUTPUT"
          echo "docs=$docs backend=$backend frontend=$frontend db=$db migration=$migration deploy=$deploy"

  # ---------------------------------------------------------------------------
  # 始终运行（与变更无关）
  # ---------------------------------------------------------------------------
  architecture-rules:
    name: Architecture Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - run: python tools/check_architecture.py

  docs-consistency:
    name: Docs Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - run: python tools/check_docs_consistency.py

  test-allowlist:
    name: Test Allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - run: python tools/check_test_allowlist.py

  governance-rules:
    name: Governance Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify ref/ and sync/ are not tracked
        run: |
          tracked=$(git ls-files ref sync)
          if [ -n "$tracked" ]; then
            echo "ERROR: ref/ or sync/ files are tracked:"; echo "$tracked"; exit 1
          fi
          echo "OK: ref/ and sync/ are not tracked"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - run: python tools/check_governance_rules.py
      - run: PURE_UNIT_TEST=1 pytest -q tools/tests/test_check_governance_rules.py

  # ---------------------------------------------------------------------------
  # 后端变化：Ruff / Mypy 增量 + 纯单元测试
  # ---------------------------------------------------------------------------
  ruff-new-files:
    name: Ruff New Files
    runs-on: ubuntu-latest
    if: needs.changes.outputs.backend_changed == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - name: Run ruff on new Python files only
        working-directory: backend
        run: |
          set -euo pipefail
          BASE="${{ needs.changes.outputs.base_sha }}"
          NEW=$(git diff --name-only --diff-filter=A "$BASE" "${{ github.sha }}" -- '*.py' | sed 's|^backend/||' | tr '\n' ' ' || true)
          if [ -n "$NEW" ]; then echo "New files: $NEW"; ruff check $NEW; else echo "No new backend Python files."; fi

  mypy-new-files:
    name: Mypy New Files
    runs-on: ubuntu-latest
    if: needs.changes.outputs.backend_changed == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - name: Run mypy on new backend files
        working-directory: backend
        run: |
          set +e
          mypy app --output json --show-error-codes --no-error-summary --hide-error-context --no-pretty > mypy-report.jsonl
          exit 0
      - name: Check new app files for mypy errors
        run: python tools/check_mypy_new_files.py "${{ needs.changes.outputs.base_sha }}" "${{ needs.changes.outputs.head_sha }}" backend/mypy-report.jsonl

  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    if: needs.changes.outputs.backend_changed == 'true'
    needs: [changes]
    defaults:
      run:
        working-directory: backend
    env:
      PURE_UNIT_TEST: "1"
      APP_ENV: test
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      # 排除 external_data：这些用例依赖 mootdx / 交易所网络接口，
      # 失败通常代表外部服务不可达而非本仓库代码回归；手工诊断时单独运行。
      - name: Run pure unit tests (no DB, no external data)
        run: pytest -m "not postgres and not external_data" --tb=short -q

  # ---------------------------------------------------------------------------
  # 数据库变化：仅真实 PostgreSQL 集成测试（marker=postgres）
  # ---------------------------------------------------------------------------
  postgres-integration-tests:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    if: needs.changes.outputs.db_changed == 'true'
    needs: [changes]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bz
          POSTGRES_PASSWORD: bz
          POSTGRES_DB: bz_stock_test
          TZ: Asia/Shanghai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+asyncpg://bz:bz@localhost:5432/bz_stock_test
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Wait for PostgreSQL
        run: for i in {1..30}; do pg_isready -h localhost -p 5432 -U bz && break; sleep 1; done
      - name: Run PostgreSQL integration tests only
        run: pytest -m "postgres and not external_data" --tb=short -q

  # ---------------------------------------------------------------------------
  # Migration 变化：增量验证（fresh→head，head→本轮 down_revision→head）
  # ---------------------------------------------------------------------------
  migration-verify:
    name: Migration Verify
    runs-on: ubuntu-latest
    if: needs.changes.outputs.migration_changed == 'true'
    needs: [changes]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bz
          POSTGRES_PASSWORD: bz
          POSTGRES_DB: bz_stock_test
          TZ: Asia/Shanghai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://bz:bz@localhost:5432/bz_stock_test
      TEST_DATABASE_URL: postgresql+asyncpg://bz:bz@localhost:5432/bz_stock_test
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Wait for PostgreSQL
        run: for i in {1..30}; do pg_isready -h localhost -p 5432 -U bz && break; sleep 1; done
      - name: Fresh DB upgrade head
        run: alembic upgrade head
      - name: Verify single head
        run: |
          set -euo pipefail
          HEADS=$(alembic heads | grep -c '(head)' || true)
          alembic heads
          if [ "$HEADS" != "1" ]; then
            echo "::error::Alembic 必须保持单一 head，当前 head 数=$HEADS"
            exit 1
          fi
      - name: Downgrade to newest migration's down_revision, then upgrade again
        run: |
          set -euo pipefail
          # working-directory 已是 backend，故使用相对 alembic/ 路径
          NEWEST=$(ls alembic/versions/ | grep -E '^[0-9]{3}_.*\.py$' | sort | tail -1)
          echo "Newest migration file: $NEWEST"
          DOWN=$(python -c "
          import importlib.util
          spec = importlib.util.spec_from_file_location('m', 'alembic/versions/$NEWEST')
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          print(m.down_revision)
          ")
          echo "down_revision: $DOWN"
          alembic downgrade "$DOWN"
          alembic upgrade head
          echo "Migration 增量往返验证通过"

  # ---------------------------------------------------------------------------
  # 前端变化：单一 job，一次 npm ci 后运行 tsc/lint/contract/build
  # ---------------------------------------------------------------------------
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    if: needs.changes.outputs.frontend_changed == 'true'
    needs: [changes]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Contract tests
        run: npm run test:contract
      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # CI Gate：只要求本次变更相关 job 成功。
  # 被 changes 明确判定不相关的 job 为 skipped，不算失败。
  # ---------------------------------------------------------------------------
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - architecture-rules
      - docs-consistency
      - test-allowlist
      - governance-rules
      - ruff-new-files
      - mypy-new-files
      - backend-unit-tests
      - postgres-integration-tests
      - migration-verify
      - frontend-checks
    steps:
      - name: Evaluate CI Gate by changes scope
        shell: bash
        run: |
          set -euo pipefail
          docs="${{ needs.changes.outputs.docs_changed }}"
          backend="${{ needs.changes.outputs.backend_changed }}"
          frontend="${{ needs.changes.outputs.frontend_changed }}"
          db="${{ needs.changes.outputs.db_changed }}"
          migration="${{ needs.changes.outputs.migration_changed }}"
          deploy="${{ needs.changes.outputs.deploy_changed }}"

          # 应运行的 job（依据 changes 输出）
          declare -A EXPECTED=(
            ["architecture-rules"]="always"
            ["docs-consistency"]="always"
            ["test-allowlist"]="always"
            ["governance-rules"]="always"
            ["ruff-new-files"]="$backend"
            ["mypy-new-files"]="$backend"
            ["backend-unit-tests"]="$backend"
            ["postgres-integration-tests"]="$db"
            ["migration-verify"]="$migration"
            ["frontend-checks"]="$frontend"
          )

          RESULTS=$(cat <<JSON
          {
            "architecture-rules": "${{ needs.architecture-rules.result }}",
            "docs-consistency": "${{ needs.docs-consistency.result }}",
            "test-allowlist": "${{ needs.test-allowlist.result }}",
            "governance-rules": "${{ needs.governance-rules.result }}",
            "ruff-new-files": "${{ needs.ruff-new-files.result }}",
            "mypy-new-files": "${{ needs.mypy-new-files.result }}",
            "backend-unit-tests": "${{ needs.backend-unit-tests.result }}",
            "postgres-integration-tests": "${{ needs.postgres-integration-tests.result }}",
            "migration-verify": "${{ needs.migration-verify.result }}",
            "frontend-checks": "${{ needs.frontend-checks.result }}"
          }
          JSON
          )

          echo "changes: docs=$docs backend=$backend frontend=$frontend db=$db migration=$migration deploy=$deploy"
          echo "================================================"
          FAILED=0
          while IFS= read -r name; do
            exp="${EXPECTED[$name]}"
            res=$(echo "$RESULTS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('$name','unknown'))")
            if [ "$exp" = "always" ]; then
              if [ "$res" != "success" ]; then
                echo "FAIL (required): $name = $res"; FAILED=$((FAILED+1))
              else
                echo "OK (required): $name"
              fi
            elif [ "$exp" = "true" ]; then
              if [ "$res" != "success" ]; then
                echo "FAIL (in-scope): $name = $res"; FAILED=$((FAILED+1))
              else
                echo "OK (in-scope): $name"
              fi
            else
              # 判定为不相关：skipped 是预期结果，不计失败。
              # 但若该 job 实际运行且失败，说明 changes 判定与真实触发条件不一致，
              # 属于 CI 配置错误，必须暴露而不是放行。
              if [ "$res" = "failure" ] || [ "$res" = "cancelled" ]; then
                echo "FAIL (out-of-scope but ran and failed): $name = $res"
                echo "  → changes 判定为不相关，但该 job 实际执行并失败，说明 if 条件与 changes 输出不一致"
                FAILED=$((FAILED+1))
              else
                echo "SKIP (out-of-scope): $name = $res"
              fi
            fi
          done < <(printf '%s\n' "${!EXPECTED[@]}" | sort)
          echo "================================================"
          if [ "$FAILED" -gt 0 ]; then
            echo "ERROR: $FAILED required/in-scope job(s) did not succeed"
            {
              echo "## CI Gate: FAILED"
              echo ""
              echo "$FAILED 个必需/范围内 job 未成功。详见上方逐项判定。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "CI Gate PASSED — all required/in-scope jobs succeeded"
          {
            echo "## CI Gate: PASSED"
            echo ""
            echo "| scope | value |"
            echo "|---|---|"
            echo "| docs | $docs |"
            echo "| backend | $backend |"
            echo "| frontend | $frontend |"
            echo "| db | $db |"
            echo "| migration | $migration |"
            echo "| deploy | $deploy |"
          } >> "$GITHUB_STEP_SUMMARY"
